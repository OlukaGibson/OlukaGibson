name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 06:00 EAT
  workflow_dispatch:

concurrency:
  group: profile-cards

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The action wipes its output folder on every run, so the light cards
      # are set aside while the dark ones are generated.
      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 3
          THEME: github
          AUTO_PUSH: false

      - name: Set light cards aside
        run: mv profile-summary-card-output/github "$RUNNER_TEMP/github"

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 3
          THEME: github_dark
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet || { git commit -m "chore: update profile summary cards" && git push; }

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
